<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra para contraste y separación -->
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="wrench-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Gradientes de materiales -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D14"/>
    </linearGradient>

    <!-- Casco del redoblante (verde esmeralda / sage del kit restaurado) -->
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="25%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="85%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Cromo brillante para aros y tensores -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Llave inglesa en cromo con reflejo -->
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Parche superior del tambor -->
    <radialGradient id="headGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
  </defs>

  <!-- Fondo circular con borde de contraste celeste/acero -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="3.5"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- ==================== REDOBLANTE ==================== -->
  <g id="snare-drum" filter="url(#badge-shadow)">
    <!-- Casco cilíndrico del tambor (cuerpo) -->
    <path d="M 20,64 A 44,14 0 0,0 108,64 L 108,94 A 44,14 0 0,1 20,94 Z" fill="url(#shellGrad)" stroke="#064E3B" stroke-width="1.5"/>

    <!-- Aro inferior (Bottom Hoop) -->
    <path d="M 18,94 A 46,14 0 0,0 110,94" fill="none" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Tensores verticales (Lugs) del redoblante -->
    <!-- Tensor 1 -->
    <rect x="27" y="65" width="4" height="26" rx="2" fill="url(#chromeGrad)" stroke="#334155" stroke-width="0.8"/>
    <circle cx="29" cy="65" r="2.5" fill="#FFFFFF"/>
    <circle cx="29" cy="91" r="2.5" fill="#94A3B8"/>

    <!-- Tensor 2 -->
    <rect x="44" y="68" width="4.5" height="27" rx="2" fill="url(#chromeGrad)" stroke="#334155" stroke-width="0.8"/>
    <circle cx="46.2" cy="68" r="2.5" fill="#FFFFFF"/>
    <circle cx="46.2" cy="95" r="2.5" fill="#94A3B8"/>

    <!-- Tensor 3 (Central) -->
    <rect x="61.5" y="70" width="5" height="27" rx="2" fill="url(#chromeGrad)" stroke="#334155" stroke-width="0.8"/>
    <circle cx="64" cy="70" r="2.8" fill="#FFFFFF"/>
    <circle cx="64" cy="97" r="2.8" fill="#94A3B8"/>

    <!-- Tensor 4 -->
    <rect x="79.5" y="68" width="4.5" height="27" rx="2" fill="url(#chromeGrad)" stroke="#334155" stroke-width="0.8"/>
    <circle cx="81.8" cy="68" r="2.5" fill="#FFFFFF"/>
    <circle cx="81.8" cy="95" r="2.5" fill="#94A3B8"/>

    <!-- Tensor 5 -->
    <rect x="97" y="65" width="4" height="26" rx="2" fill="url(#chromeGrad)" stroke="#334155" stroke-width="0.8"/>
    <circle cx="99" cy="65" r="2.5" fill="#FFFFFF"/>
    <circle cx="99" cy="91" r="2.5" fill="#94A3B8"/>

    <!-- Mecanismo de bordonera lateral (Strainer) -->
    <rect x="15" y="70" width="4" height="12" rx="1.5" fill="url(#chromeGrad)" stroke="#090D14" stroke-width="1"/>
    <line x1="17" y1="70" x2="13" y2="65" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

    <!-- Parche superior (Drumhead) -->
    <ellipse cx="64" cy="62" rx="44" ry="14" fill="url(#headGrad)" stroke="#94A3B8" stroke-width="1"/>

    <!-- Aro superior (Top Hoop) cromado -->
    <ellipse cx="64" cy="61" rx="46" ry="14.5" fill="none" stroke="url(#chromeGrad)" stroke-width="4.5"/>
    <ellipse cx="64" cy="61" rx="46" ry="14.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.8"/>
  </g>

  <!-- ==================== LLAVE INGLESA ==================== -->
  <!-- Colocada en diagonal sobre el redoblante con relieve cromado y perfil nítido -->
  <g id="wrench" filter="url(#wrench-shadow)" transform="rotate(-15, 64, 45)">
    <!-- Silueta exterior con reborde celeste para máxima legibilidad a 16px -->
    <!-- Mango de la llave -->
    <rect x="46" y="24" width="42" height="11" rx="5" fill="url(#wrenchGrad)" stroke="#38BDF8" stroke-width="1.8"/>

    <!-- Rebaje interior del mango (canal característico) -->
    <rect x="52" y="27" width="24" height="5" rx="2.5" fill="#64748B" opacity="0.4"/>

    <!-- Agujero hexagonal / circular al final del mango -->
    <circle cx="82" cy="29.5" r="2.8" fill="#090D14" stroke="#38BDF8" stroke-width="1"/>

    <!-- Cabeza de la llave inglesa ajustable -->
    <!-- Cuerpo principal de la mandíbula fija -->
    <path d="M 48,22 
             C 45,17 38,15 32,18 
             C 28,20 25,24 26,29 
             L 34,29 
             L 34,35 
             L 26,35 
             C 27,40 32,44 38,44 
             C 43,44 47,40 48,36 Z" 
          fill="url(#wrenchGrad)" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Boca abierta de la llave inglesa -->
    <polygon points="23,24 35,27 35,37 23,34" fill="#090D14"/>

    <!-- Mandíbula móvil ajustable -->
    <path d="M 33,26 L 24,24 L 23,20 L 32,19 Z" fill="#E2E8F0" stroke="#38BDF8" stroke-width="1"/>

    <!-- Moleteado / Tornillo sinfín de ajuste -->
    <rect x="35" y="28" width="5.5" height="8" rx="1.5" fill="#F59E0B" stroke="#78350F" stroke-width="0.8"/>
    <line x1="36" y1="30.5" x2="39.5" y2="30.5" stroke="#451A03" stroke-width="0.8"/>
    <line x1="36" y1="33.5" x2="39.5" y2="33.5" stroke="#451A03" stroke-width="0.8"/>

    <!-- Brillo superior en la mandíbula -->
    <path d="M 32,19 C 36,17 42,19 45,23" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
